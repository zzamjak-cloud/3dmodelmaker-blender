schema_version = "1.0.0"

id = "lp3d_modelmaker"
version = "0.37.0"
name = "AI LowPoly ModelMaker"
tagline = "GPT-6 Astra generates game-ready low-poly models in one turn"
maintainer = "Woody <jinpyoung@loadcomplete.com>"
type = "add-on"

blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Woody (jinpyoung@loadcomplete.com)"]
website = "https://github.com/zzamjak-cloud/3dmodelmaker-blender"

tags = ["Modeling", "Pipeline"]

[permissions]
files = "에이전트 세션 작업 파일 저장 및 FBX/glTF 익스포트"

# NOTE: [build]를 정의하면 Blender 기본 제외 목록을 덮어쓰므로
# 공통 제외(__pycache__, .git, *.zip)도 여기에 명시한다.
[build]
paths_exclude_pattern = [
  # Blender 기본값
  "__pycache__/",
  "/.git/",
  "/*.zip",
  # 버전 관리 / CI / 에디터 설정
  "/.github/",
  "/.gitignore",
  # 개발 도구 (애드온 실행에 불필요)
  "/scripts/",
  "/tests/",
  "/docs/",
  "/dist/",
  "/Generate/",   # 생성 결과물 작업 폴더
  "*.blend",
  "/.claude/",
  "/.omc/",
  "/.superpowers/",
  "/.serena/",
  "/.terminal-assistance/",
  "/Screenshot_0.png",
  # 기타
  "*.py[cod]",
  ".DS_Store",
  "*.blend1",
]
