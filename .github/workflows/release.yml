name: Release

on:
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: '새 릴리스 태그 접두사 (기존 태그 재사용 금지)'
        required: true
        default: 'v'
        type: string

permissions:
  contents: write # 드래프트 릴리스 생성에 필요

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, validate and draft release
        id: build
        uses: natapol2547/blender-extension-builder@main
        with:
          source-dir: '.'
          tag-prefix: ${{ inputs.tag_prefix }}

      - name: Summary
        run: |
          echo "Built ${{ steps.build.outputs.addon-id }} ${{ steps.build.outputs.addon-version }} with Blender ${{ steps.build.outputs.blender-version }}"
          echo "Draft release: ${{ steps.build.outputs.release-url }}"
